<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telkom SA Digital Assistant</title>
<link rel="icon" href="{{ static_url('img/favicon.svg') }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ static_url('css/style.css') }}">
</head>
<body>

<div class="app" id="app" data-view="landing">

  <header class="brand">
    <img class="brand-logo" src="{{ static_url('img/telkom-logo.png') }}" alt="Telkom">
  </header>

  <section class="landing" id="landing">
    <div class="landing-inner">
      <img class="landing-logo" src="{{ static_url('img/telkom-logo.png') }}" alt="Telkom">

      <h1 class="landing-title">Hello, Welcome to Telkom AI assistant</h1>

      <div class="landing-input-wrap">
        <div class="input-shell">
          <input id="landing-input" type="text" autocomplete="off"
                 placeholder="Type your query to get started..." maxlength="1000">
          <button class="send-btn" id="landing-send-btn" type="button" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21.4 11.1 4.6 3.3a.9.9 0 0 0-1.25 1.05L5.2 11.2a.9.9 0 0 0 .72.65l7.6 1.15-7.6 1.15a.9.9 0 0 0-.72.65l-1.85 6.85A.9.9 0 0 0 4.6 22.7l16.8-7.8a2.1 2.1 0 0 0 0-3.8z"
                    fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="landing-suggestions" id="landing-suggestions">
        <button type="button" class="suggestion-card"
                data-question="My internet connection is slow today">
          <span class="suggestion-text">My internet connection is slow today</span>
          <span class="suggestion-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </button>
        <button type="button" class="suggestion-card"
                data-question="How do I cancel my contract or follow up on a cancellation?">
          <span class="suggestion-text">How do I cancel my contract or follow up on a cancellation?</span>
          <span class="suggestion-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </button>
        <button type="button" class="suggestion-card"
                data-question="Which router do I get with the LTE Advanced service?">
          <span class="suggestion-text">Which router do I get with the LTE Advanced service?</span>
          <span class="suggestion-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </button>
        <button type="button" class="suggestion-card"
                data-question="What is Telkom's Single Number service?">
          <span class="suggestion-text">What is Telkom's Single Number service?</span>
          <span class="suggestion-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </button>
      </div>
    </div>
  </section>

  <main class="chat" id="chat">
    <div class="chat-inner" id="messages"></div>
  </main>

  <footer class="composer">
    <div class="composer-inner">
      <button class="home-btn" id="home-btn" type="button" title="Start a new conversation" aria-label="Start a new conversation">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.4 10.6 12 3.6l8.6 7v9.1a1.3 1.3 0 0 1-1.3 1.3h-4.6v-6.1H9.3V21H4.7a1.3 1.3 0 0 1-1.3-1.3z"
                fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="input-shell">
        <input id="composer-input" type="text" autocomplete="off"
               placeholder="Type your query to get started..." maxlength="1000">
        <button class="send-btn" id="send-btn" type="button" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21.4 11.1 4.6 3.3a.9.9 0 0 0-1.25 1.05L5.2 11.2a.9.9 0 0 0 .72.65l7.6 1.15-7.6 1.15a.9.9 0 0 0-.72.65l-1.85 6.85A.9.9 0 0 0 4.6 22.7l16.8-7.8a2.1 2.1 0 0 0 0-3.8z"
                  fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </footer>

</div>

<template id="tpl-bot-avatar">
  <div class="avatar avatar-bot">
    <img src="{{ static_url('img/bot-avatar.gif') }}" alt="" aria-hidden="true">
  </div>
</template>

<template id="tpl-shimmer">
  <div class="shimmer" aria-hidden="true">
    <svg viewBox="0 0 620 90" preserveAspectRatio="none">
      <defs>
        <linearGradient id="shA" x1="0" x2="1">
          <stop offset="0" stop-color="#2f7dff" stop-opacity="0"/>
          <stop offset=".5" stop-color="#2f7dff" stop-opacity="1"/>
          <stop offset="1" stop-color="#2f7dff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="shB" x1="0" x2="1">
          <stop offset="0" stop-color="#6a7cff" stop-opacity="0"/>
          <stop offset=".5" stop-color="#6a7cff" stop-opacity="1"/>
          <stop offset="1" stop-color="#8f7bff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="shC" x1="0" x2="1">
          <stop offset="0" stop-color="#7fd0ff" stop-opacity="0"/>
          <stop offset=".5" stop-color="#b5e6ff" stop-opacity="1"/>
          <stop offset="1" stop-color="#e8f7ff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="shD" x1="0" x2="1">
          <stop offset="0" stop-color="#dcefff" stop-opacity="0"/>
          <stop offset=".45" stop-color="#ffffff" stop-opacity=".95"/>
          <stop offset="1" stop-color="#dcefff" stop-opacity="0"/>
        </linearGradient>
        <filter id="shBlur" x="-20%" y="-120%" width="140%" height="340%">
          <feGaussianBlur stdDeviation="2.6"/>
        </filter>
      </defs>
      <g filter="url(#shBlur)">
        <ellipse class="sh s0" cx="310" cy="45" rx="308" ry="4"  fill="url(#shD)"/>
        <ellipse class="sh s1" cx="170" cy="45" rx="150" ry="14" fill="url(#shA)"/>
        <ellipse class="sh s2" cx="285" cy="45" rx="110" ry="27" fill="url(#shB)"/>
        <ellipse class="sh s3" cx="400" cy="45" rx="125" ry="18" fill="url(#shC)"/>
        <ellipse class="sh s4" cx="505" cy="45" rx="110" ry="10" fill="url(#shA)"/>
      </g>
    </svg>
  </div>
</template>

<template id="tpl-user-avatar">
  <div class="avatar avatar-user">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="24" fill="#ffffff"/>
      <circle cx="24" cy="19" r="7.6" fill="#0a97ff"/>
      <path d="M8.6 40.4a15.8 15.8 0 0 1 30.8 0 24 24 0 0 1-30.8 0z" fill="#0a97ff"/>
    </svg>
  </div>
</template>

<script src="{{ static_url('js/app.js') }}"></script>
</body>
</html>
